<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fc">
    <title>Lex - Online Lexical Analyzer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        :root {
            color-scheme: light;
            --ink: #1d2940;
            --muted: #56657c;
            --blue: #435de8;
            --blue-dark: #3048c7;
            --line: #dce3ef;
            --surface: #ffffff;
            --canvas: #f5f7fc;
            --code: #f8faff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }
        ::selection { background: #cbd4ff; color: #172551; }
        .app-container { max-width: 1280px; margin: auto; padding: 0 32px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            padding: 26px 0;
            border-bottom: 1px solid var(--line);
        }
        .brand { display: flex; align-items: center; gap: 13px; }
        .brand-mark {
            display: grid; place-items: center; width: 40px; height: 40px;
            border-radius: 11px; background: var(--blue); color: white;
            font-family: ui-monospace, monospace; font-size: 20px; font-weight: 700;
        }
        h1 { margin: 0; color: #263caa; font-size: 1.5rem; line-height: 1; letter-spacing: -.03em; }
        header p { margin: 5px 0 0; color: var(--muted); font-size: .8rem; }
        .header-link { color: var(--muted); font-size: .84rem; font-weight: 600; text-decoration: none; }
        .header-link:hover { color: var(--blue-dark); }
        main { padding: 42px 0 0; }
        .intro { margin-bottom: 25px; }
        .intro h2 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.6vw, 2rem); letter-spacing: -.03em; line-height: 1.2; }
        .intro p { margin: 0; color: var(--muted); font-size: .95rem; }
        .controls { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
        .control-group { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
        .language-control { display: grid; gap: 6px; }
        label { color: var(--muted); font-size: .75rem; font-weight: 700; }
        button, select, textarea { font: inherit; }
        button, select { min-height: 42px; border-radius: 8px; font-size: .875rem; }
        button { border: 1px solid transparent; padding: 0 17px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: background-color .18s, border-color .18s, color .18s; }
        button:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid #a9b7ff; outline-offset: 2px; }
        .btn-primary { background: var(--blue); color: white; }
        .btn-primary:hover { background: var(--blue-dark); }
        .btn-secondary, .btn-example { background: var(--surface); border-color: var(--line); color: var(--ink); }
        .btn-secondary:hover, .btn-example:hover { background: #edf1ff; border-color: #bdc9ee; }
        select { min-width: 182px; padding: 0 36px 0 12px; border: 1px solid #cbd5e5; background: white; color: var(--ink); cursor: pointer; }
        .container { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
        .input-container, .output-container { min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
        .panel-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
        .panel-heading h2 { margin: 0; font-size: .94rem; letter-spacing: -.01em; }
        .panel-heading span { color: var(--muted); font-size: .75rem; }
        textarea, #output {
            display: block; width: 100%; height: 390px; padding: 16px; border: 1px solid var(--line);
            border-radius: 9px; background: var(--code); color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .84rem; line-height: 1.7;
        }
        textarea { resize: vertical; min-height: 200px; caret-color: var(--blue); }
        textarea::placeholder { color: #59687c; opacity: 1; }
        #output { overflow: auto; overflow-wrap: anywhere; }
        #output:empty::before { content: 'Your tokens will appear here after analysis.'; color: #59687c; }
        .output-container { position: relative; }
        #loading { display: none; align-items: center; position: absolute; inset: 55px 20px 20px; justify-content: center; background: rgba(248, 250, 255, .94); color: var(--blue-dark); font-size: .9rem; font-weight: 600; border-radius: 9px; }
        .loading-spinner { width: 17px; height: 17px; margin-right: 10px; border: 2px solid #c4cef5; border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .execution-stats { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--muted); font: 600 .72rem Inter, sans-serif; }
        .execution-stats span { font-weight: 400; }
        .token { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid #e8edf5; font-size: .8rem; }
        .token-type { min-width: 125px; color: #334dc0; font-weight: 700; font-size: .7rem; }
        .token-lexeme { color: var(--ink); white-space: pre-wrap; }
        .token-location { margin-left: auto; color: var(--muted); font-size: .7rem; white-space: nowrap; }
        .token.keyword .token-type { color: #7137a4; }
        .token.string_literal .token-type, .token.char_literal .token-type { color: #20704b; }
        .token.integer .token-type, .token.float .token-type, .token.scientific .token-type, .token.hex .token-type, .token.binary .token-type, .token.octal .token-type { color: #a43d65; }
        .token.error .token-type, .error-container { color: #a92f3f; }
        .error-container { padding: 12px; margin-bottom: 12px; background: #fff1f2; border-radius: 8px; }
        .error-title { font-weight: 700; }
        .error-message { white-space: pre-wrap; overflow-wrap: anywhere; }
        footer { display: flex; justify-content: space-between; gap: 16px; padding: 28px 0 32px; color: var(--muted); font-size: .78rem; }
        footer p { margin: 0; }
        footer a { color: var(--blue-dark); text-underline-offset: 3px; }
        @media (max-width: 720px) {
            .app-container { padding: 0 18px; }
            header { padding: 19px 0; }
            header p { max-width: 220px; }
            main { padding-top: 30px; }
            .controls { align-items: stretch; }
            .language-control, select { width: 100%; }
            .controls > .control-group { width: 100%; }
            .controls button { flex: 1; padding-inline: 8px; font-size: .8rem; }
            .container { grid-template-columns: minmax(0, 1fr); }
            .input-container, .output-container { padding: 16px; }
            textarea, #output { height: 280px; }
            footer { flex-wrap: wrap; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">&lt;/&gt;</div>
                <div><h1>Lex</h1><p>Online Lexical Analyzer powered by WebAssembly</p></div>
            </div>
            <a class="header-link" href="https://github.com/adhamafis/lex">GitHub Repository</a>
        </header>
        <main>
            <div class="intro">
                <h2>Explore your code, one token at a time.</h2>
                <p>Choose a language, add source code, and analyze the result.</p>
            </div>
            <div class="controls">
                <div class="language-control">
                    <label for="language">Language</label>
                    <select id="language"><option value="cpp">C++</option><option value="js">JavaScript</option></select>
                </div>
                <div class="control-group">
                    <button id="exampleBtn" class="btn-example">Load Example</button>
                    <button id="clearBtn" class="btn-secondary">Clear</button>
                    <button id="analyzeBtn" class="btn-primary">Analyze</button>
                </div>
            </div>
            <div class="container">
                <section class="input-container" aria-labelledby="source-heading">
                    <div class="panel-heading"><h2 id="source-heading">Source Code</h2><span>Input</span></div>
                    <textarea id="source" aria-labelledby="source-heading" placeholder="Enter your code here..." spellcheck="false"></textarea>
                </section>
                <section class="output-container" aria-labelledby="output-heading">
                    <div class="panel-heading"><h2 id="output-heading">Token Output</h2><span>Results</span></div>
                    <div id="loading" role="status"><div class="loading-spinner" aria-hidden="true"></div><span>Analyzing...</span></div>
                    <div id="output" role="region" aria-live="polite" aria-label="Token output" tabindex="0"></div>
                </section>
            </div>
        </main>
        <footer>
            <p>Powered by <a href="https://github.com/adhamafis/lex">Lex</a> compiled to WebAssembly</p>
            <a href="https://github.com/adhamafis/lex">GitHub Repository</a>
        </footer>
    </div>
    <script src="lex.js"></script>
    <script src="app.js"></script>
</body>
</html>
